# HTTPS via Tailscale instead of a public domain:
#   tailnet device --HTTPS--> tailscale serve (host, *.ts.net cert) --> caddy 127.0.0.1:18080 (token) --> cognee-mcp
#
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#   tailscale serve --bg --https=443 http://127.0.0.1:18080

services:
  caddy:
    ports: !override
      - "127.0.0.1:18080:18080"  # host loopback only; tailscale serve is the way in
    volumes: !override
      - ./Caddyfile.tailscale:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
